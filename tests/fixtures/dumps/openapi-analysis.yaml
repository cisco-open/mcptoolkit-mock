version: https://developer.cisco.com/mcp_contract_dump/schema/0.3.6
dumpDetails:
  toolName: mcpcontract
  toolVersion: 0.19.0
  description: This dump was generated by connecting to a live MCP server instance and extracting its capabilities.
  createdAt: 2026-01-10T09:04:05.697Z
  mcpServerConfig:
    name: openapi-analysis-mcp
    transport: streamable-http
    url: http://localhost:3001/mcp
  dumpExecution:
    mcpProtocolUsed: 2025-06-18
    sessionIdSupported: false
    clientCapabilitiesSent:
      roots:
        listChanged: true
      sampling: {}
    corsSupport:
      browserReady: true
      responseHeaders: {}
      preflight:
        tested: true
        status: 204
        accessControlAllowOrigin: http://localhost:3000
        accessControlAllowMethods:
          - GET
          - HEAD
          - PUT
          - PATCH
          - POST
          - DELETE
        accessControlAllowHeaders:
          - Content-Type
          - Mcp-Session-Id
    pingSupported: true
    pingLatencyMs: 5
serverInfo:
  name: openapi-analysis-mcp
  version: 0.7.3
  protocolVersion: 2025-06-18
  capabilities:
    prompts:
      listChanged: false
    resources:
      listChanged: false
    tools:
      listChanged: false
tools:
  - name: get_upload_instructions
    description: "⚠️ IMPORTANT: Call this FIRST to learn how to upload OpenAPI documents before using other analysis tools. Returns complete workflow instructions."
    inputSchema:
      type: object
      properties: {}
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_document_info
    description: "Get basic information about an uploaded OpenAPI document (title, version, description, servers). NOTE: Documents must first be uploaded via HTTP POST to the upload API to obtain a documentId."
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: list_operations
    description: List all API operations from an OpenAPI document with details (path, method, summary, parameters, etc.). Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
        method:
          type: string
          description: "Optional: filter by HTTP method (GET, POST, etc.)"
        includeDeprecated:
          type: boolean
          default: true
          description: Whether to include deprecated operations
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: search_operations
    description: Search for API operations by path, summary, description, operationId, or tags. Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
        query:
          type: string
          description: Search query (case-insensitive)
      required:
        - documentId
        - query
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_security_schemes
    description: Get all security schemes defined in the OpenAPI document (authentication methods). Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_schemas
    description: Get all data schemas/models defined in the OpenAPI document (request/response structures). Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: validate_structure
    description: Perform basic validation of OpenAPI document structure (checks for required fields). Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_statistics
    description: Get statistics about the API (operation count, methods distribution, schemas count, etc.). Requires a documentId from a previously uploaded document.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: extract_operations
    description: Extract detailed operation information from an OpenAPI document with pagination support. Returns comprehensive metadata about each API operation including summary, description, operationId, parameters, request body, responses, tags, and deprecation status. Useful for LLMs to evaluate API summaries using smaller, paginated datasets. Supports both OpenAPI 3.x and Swagger 2.0.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID returned from the upload endpoint
        page:
          type: number
          description: "Page number for pagination (starts at 1, default: 1)"
        page_size:
          type: number
          description: "Number of operations per page (default: 50, max: 200)"
        method:
          type: string
          description: Filter by HTTP method (GET, POST, PUT, DELETE, etc.)
        tag:
          type: string
          description: Filter by tag
        deprecated:
          type: boolean
          description: Filter by deprecation status (true for deprecated only, false for non-deprecated only)
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: list_documents
    description: List all stored OpenAPI documents with metadata (name, version, tags, organization, etc.). Supports pagination and sorting.
    inputSchema:
      type: object
      properties:
        limit:
          type: number
          description: "Max results (default: 50)"
        offset:
          type: number
          description: "Pagination offset (default: 0)"
        sortBy:
          type: string
          enum:
            - name
            - uploadedAt
            - updatedAt
          description: "Sort field (default: uploadedAt)"
        sortOrder:
          type: string
          enum:
            - asc
            - desc
          description: "Sort order (default: desc)"
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: search_datastore
    description: Search for OpenAPI documents by name, tags, organization, or version. Returns matching document metadata.
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: API name (partial match, case-insensitive)
        tags:
          type: array
          items:
            type: string
          description: Filter by tags (matches if any tag matches)
        organization:
          type: string
          description: Filter by organization (partial match)
        version:
          type: string
          description: Filter by version (exact match)
        isLatest:
          type: boolean
          description: "Only latest versions (default: all versions)"
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_upload_history
    description: Get complete upload history for a document (audit trail of all uploads). Shows who uploaded, when, from which source, and with what context.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID
        limit:
          type: number
          description: "Max results (default: 50)"
        offset:
          type: number
          description: "Pagination offset (default: 0)"
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_upload_details
    description: Get details of a specific upload event by uploadId. Returns metadata about who uploaded, from where, and any associated context.
    inputSchema:
      type: object
      properties:
        uploadId:
          type: string
          description: The upload ID from upload response or history
      required:
        - uploadId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: lint_document
    description: Submit an OpenAPI document for asynchronous linting analysis using Spectify. Returns a job ID for polling status and results. Linting may take 30-60 seconds for large documents.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID from upload (UUID format)
        rulesetName:
          type: string
          description: Ruleset to use (e.g., "pubhub", "spectral-oas"). Omit for default.
        rulesetVersion:
          type: string
          description: Specific ruleset version (e.g., "1.0.0"). Defaults to latest.
        options:
          type: object
          properties:
            forceRun:
              type: boolean
              description: "Bypass cache and force a new lint run (default: false)"
            failOnError:
              type: boolean
              description: "Whether to fail job on first error (default: false)"
            severity:
              type: string
              enum:
                - error
                - warn
                - info
                - hint
              description: 'Minimum severity to report (default: "hint")'
          additionalProperties: false
          description: Additional linting options
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_lint_status
    description: Get the current status and progress of a lint job. Use this to poll job completion after submitting with lint_document.
    inputSchema:
      type: object
      properties:
        jobId:
          type: string
          description: The job ID returned from lint_document
      required:
        - jobId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: get_lint_results
    description: Retrieve the complete results of a completed lint job. Call this after get_lint_status shows status "completed".
    inputSchema:
      type: object
      properties:
        jobId:
          type: string
          description: The job ID returned from lint_document
        format:
          type: string
          enum:
            - full
            - summary
            - issues-only
          description: 'Result format (default: "full")'
      required:
        - jobId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: list_rulesets
    description: List all available rulesets that can be used for linting OpenAPI documents. Shows ruleset metadata including available versions.
    inputSchema:
      type: object
      properties: {}
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
  - name: invalidate_lint_cache
    description: Invalidate cached lint results for a document. Use this after updating a document to force re-linting.
    inputSchema:
      type: object
      properties:
        documentId:
          type: string
          description: The document ID to invalidate cache for
      required:
        - documentId
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
    execution:
      taskSupport: forbidden
resources:
  - name: documents
    uri: documents://list
    description: List all uploaded OpenAPI documents
    mimeType: application/json
resourceTemplates:
  - name: document
    uriTemplate: openapi://{documentId}
    description: Get detailed information about a specific document
    mimeType: application/json
prompts:
  - name: upload-workflow
    description: Instructions for uploading and analyzing OpenAPI documents
