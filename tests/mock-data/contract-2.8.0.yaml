tools:
  - name: search
    description: |-
      Search and filter Cisco's API/SDK inventory. Supports filtering by kind (API/SDK/GROUP), organization (CN, SBG, CTG, CX, etc.), and name with partial matching. Returns paginated results with optional field selection.

      Common Usage Patterns:
      1. Search by name: {"name": "Nexus Dashboard", "partial": true}
      2. Filter by organization: {"organization": "SBG"}
      3. Find APIs only: {"kind": "API"}
      4. Combine filters: {"kind": "API", "organization": "SBG", "name": "defense"}
      5. Get specific details: {"name": "API name", "details": "contacts"}
      6. Pagination: {"pageSize": 20, "cursor": "previous_cursor"}

      Parameter Details:
      - name: Search card names (case-insensitive, partial matching by default)
      - kind: API, SDK, or GROUP
      - organization: CN, SBG, CTG, CX, Operations, CSDI, Splunk, Sales
      - partial: true (default) for substring match, false for exact match
      - details: contacts, releases, api_quality, api_insights, info
      - pageSize: 1-100 (default: 10)
      - cursor: from previous response for next page

      Related Prompts: Use "search" prompt for guided API discovery

      Error Handling:
      - Returns -32602 (InvalidParams) for invalid parameters with detailed validation errors
      - Returns -32603 (InternalError) for server-side issues
    inputSchema:
      type: object
      properties:
        kind:
          type: string
          enum:
            - API
            - SDK
            - MCP
            - GROUP
          description: "Filter by card type: API (REST, gRPC, GraphQL, etc.), SDK (JavaScript, Python, Swift, etc.), MCP (Model Context Protocol servers), or GROUP (logical collections). **Required when using organization filter**."
        audience:
          type: string
          enum:
            - EXTERNAL
            - INTERNAL
          default: EXTERNAL
          description: "Filter by target audience: EXTERNAL (public customer/partner facing) or INTERNAL (Cisco-internal). Default: EXTERNAL. GROUP cards are automatically included if they contain any matching API/SDK/MCP cards."
        organization:
          type: string
          description: Filter by organization code (CN, SBG, CTG, CX, Operations, CSDI, Splunk, Sales). **Requires kind to be "API", "SDK", or "MCP"**. GROUP cards do not have organization. Supports partial matching when partial=true
        name:
          type: string
          description: 'Filter by card name or alternate names. Case-insensitive with partial matching by default. Example: "defense" matches "AI Defense API"'
        partial:
          type: boolean
          default: true
          description: "Enable partial/substring matching for name and organization (default: true). Set to false for exact matches only"
        details:
          type: string
          enum:
            - contacts
            - releases
            - api_quality
            - api_insights
            - info
          description: "Return only specific section: contacts (team info), releases (versions/status), api_quality (metrics), api_insights (org mapping), or info (basic metadata)"
        cursor:
          type: string
          description: Pagination cursor from previous response. Use the "cursor" value returned in results to fetch next page
        pageSize:
          type: number
          minimum: 1
          maximum: 100
          description: Number of results per page. Default is from config (typically 10), maximum 100. Returns hasMore=true if more results available
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
  - name: refresh-cache
    description: |-
      Manually trigger an inventory refresh from the remote URL. The server automatically refreshes every 15 minutes, but this tool allows on-demand updates. Returns the new version number and update status. Note: Updates only occur if the remote version is different from the cached version.

      Common Usage Pattern:
      1. Check for updates: {} (no parameters needed)

      Parameter Details:
      - No parameters required

      Returns:
      - success: true/false
      - message: Status description
      - version: Current inventory version

      Error Handling:
      - Returns -32001 (ServiceUnavailable) if remote inventory URL is unreachable (retryable)
      - Returns -32603 (InternalError) for other server-side issues
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
  - name: stats
    description: |-
      Generate statistical analysis of the inventory with optional grouping. Get aggregate counts and distributions grouped by: organization (CN, SBG, CTG, etc.), status (ACTIVE, EOL, ONBOARDING), kind (API, SDK, GROUP), deployment (Cloud, On-prem), or lifecycle (Product-led, API-led, etc.). Without grouping, returns overall counts.

      Common Usage Patterns:
      1. Overall statistics: {} (no parameters)
      2. By organization: {"groupBy": "organization"}
      3. By status: {"groupBy": "status"}
      4. By kind: {"groupBy": "kind"}
      5. By deployment: {"groupBy": "deployment"}
      6. By lifecycle: {"groupBy": "lifecycle"}

      Parameter Details:
      - groupBy (optional): organization, status, kind, deployment, lifecycle
      - Omit groupBy for overall totals

      Related Prompts: Use "organization-report" prompt for detailed org analysis

      Error Handling:
      - Returns -32602 (InvalidParams) for invalid groupBy values
      - Returns -32603 (InternalError) for server-side issues
    inputSchema:
      type: object
      properties:
        groupBy:
          type: string
          enum:
            - organization
            - status
            - kind
            - deployment
            - lifecycle
            - audience
          description: "Group statistics by: organization (CN, SBG, CTG, etc.), status (ACTIVE, EOL, ONBOARDING), kind (API, SDK, MCP), deployment (Cloud, On-prem), lifecycle (Product-led, API-led, etc.), or audience (EXTERNAL, INTERNAL). Omit to get default grouping by kind. Returns total count and breakdown with counts per group"
        audience:
          type: string
          enum:
            - EXTERNAL
            - INTERNAL
          default: EXTERNAL
          description: "Filter statistics by target audience: EXTERNAL (public customer/partner facing) or INTERNAL (Cisco-internal). Default: EXTERNAL. GROUP cards are always excluded from statistics as they do not have an audience field."
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
  - name: list-organizations
    description: List all Cisco organizations present in the inventory. Returns an array of organization codes (e.g., CN, SBG, CTG, CX, Operations, CSDI, Splunk, Sales). Useful for agent discoverability and UI dropdowns.
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
  - name: schema-version
    description: Get information about inventory schema version compatibility. Returns the supported schema version, current inventory version, and compatibility status. Use this to check if the loaded inventory is compatible with the MCP server.
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
  - name: get-card
    description: |-
      Retrieve detailed information for a specific card by its ID. This tool provides the same functionality as the card:/// resource but is compatible with MCP clients that do not support resource fetching (e.g., GitHub Copilot). Returns complete card metadata including name, description, contacts, releases, and quality metrics.

      Common Usage Patterns:
      1. Get full card details: {"id": "cisco-secure-network-analytics-api"}
      2. Get specific section: {"id": "card-id", "details": "contacts"}
      3. Check releases: {"id": "card-id", "details": "releases"}

      Parameter Details:
      - id: Card identifier (use search tool to find IDs)
      - details (optional): contacts, releases, api_quality, api_insights, info

      Note: For MCP clients with resource support, use card:///{id} resource instead.

      Error Handling:
      - Returns -32602 (InvalidParams) for invalid parameters
      - Returns -32603 (InternalError) if card not found or server error
    inputSchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the card to retrieve (e.g., "cisco-secure-network-analytics-api")
        details:
          type: string
          enum:
            - contacts
            - releases
            - api_quality
            - api_insights
            - info
          description: "Return only specific section: contacts (team info), releases (versions/status), api_quality (metrics), api_insights (org mapping), or info (basic metadata)"
      required:
        - id
      additionalProperties: false
      $schema: http://json-schema.org/draft-07/schema#
resources:
  - name: schema://API
    title: API Card Schema
    uri: schema://API
    description: |-
      JSON Schema for API cards (REST, gRPC, GraphQL, etc.)

      Retrieve the JSON Schema for API card type. Returns the official JSON Schema definition used to validate inventory data structure.

      Usage Pattern:
      - URI: schema://API
      - Schema version: 1.6.2

      Use Cases:
      - Validate custom inventory data
      - Generate types for other programming languages
      - Understand card structure and validation rules
      - Reference for developing inventory producers

      Error Handling:
      - Returns -32000 (NotFound) if schema file is missing
      - Returns -32603 (InternalError) for server-side issues
    mimeType: application/schema+json
