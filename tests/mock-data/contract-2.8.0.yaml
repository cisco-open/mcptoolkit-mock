resourceTemplates:
  - name: card
    title: Card Resource
    uriTemplate: card:///{id}
    description: |-
      Retrieve comprehensive details for a specific card by its numeric ID. Returns complete metadata including: name, description, organization, contacts (roles, emails), releases (versions, status, documentation), quality metrics (champions, initiatives), and insights (organization mapping). Works for all card types: API (REST, gRPC, GraphQL, etc.), SDK (JavaScript, Python, Swift, etc.), and GROUP (logical collections).

      Usage Pattern:
      - URI format: card:///{id} where {id} is a numeric card ID
      - Example: card:///52 returns full details for card ID 52
      - Use search tool first to find card IDs

      Workflow:
      1. Search for cards: search tool with {"name": "API name"}
      2. Get ID from search results
      3. Fetch full details: card:///{id} resource

      Error Handling:
      - Returns -32602 (InvalidParams) if ID is not a valid number
      - Returns -32000 (NotFound) if card with specified ID does not exist
      - Returns -32603 (InternalError) for server-side issues
    mimeType: application/json
prompts:
  - name: search
    description: Guided API discovery with intelligent filtering. Find APIs by organization (CN, SBG, CTG, CX, etc.), style (REST, gRPC, GraphQL), deployment type (Cloud, On-prem), or status (ACTIVE, EOL, ONBOARDING). Returns a curated summary with names, descriptions, and key characteristics. Use this for exploratory API searches when you need context and recommendations.
  - name: api-quality-metrics
    description: Comprehensive API quality analysis with metrics and governance insights. Analyzes quality champions, initiative enrollments, approval thresholds, and DevX review status. Provides actionable recommendations for quality improvements. Use this for API governance, quality audits, and continuous improvement planning.
  - name: list-deprecated-apis
    description: Track deprecated and end-of-life APIs with sunset timelines and migration paths. Identifies APIs with DEPRECATED or EOL status, provides sunset timeline information from releases, and suggests migration alternatives. Essential for API lifecycle management, customer communication, and technical debt planning.
  - name: organization-report
    description: Comprehensive organization analysis across the API Inventory. Provides statistical breakdown of API styles, deployment types, lifecycle stages, and status distribution. Optionally includes SDK information with platform and language analysis. Highlights key APIs, notable trends, and strategic focus areas. Perfect for portfolio reviews, strategic planning, and stakeholder reporting.
  - name: getting-started
    description: Complete guide to using the API Inventory MCP Server effectively. Explains available tools, their parameters, common workflows, and best practices. Shows real examples for each tool and how to combine them for complex queries. Perfect for first-time users or when you need a refresher on capabilities. Use this prompt when you're unsure which tool to use or how to structure your query.
